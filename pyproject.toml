[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.37.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "python-telegram-bot>=22.8",
    "qrcode[pil]>=8.2",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["app/tests", "pipeline/tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
